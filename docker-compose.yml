services:
  postgres:
    image: postgres:16
    container_name: digital-card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: digital_card_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_card_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
