services:
  postgres:
    image: postgres:16
    container_name: digital-card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: digital_card_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_card_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-card-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Override localhost with the postgres service name so the app can reach the DB
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/digital_card_db?schema=public"
      HOSTNAME: "0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
